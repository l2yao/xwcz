<!doctype html>

    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button class="brand" data-route="home">熏聞成種</button>

      <main>
        <section id="view" class="view">
          <div class="loading">載入中...</div>
        </section>

      <nav class="tabbar">

        <button data-route="video">影音</button>
        <button data-route="articles">資訊</button>
        <button data-route="live">直播</button>

    </div>

    <script type="module" src="./src/main.js"></script>

</html>
